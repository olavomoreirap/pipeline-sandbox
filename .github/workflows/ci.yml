name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test
          else
            echo "Sem package.json ainda; nada para testar."
          fi
